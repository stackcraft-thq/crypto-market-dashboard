<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A clearer view of crypto. Explore the top 20 cryptocurrencies with live prices, market insights, and simple search." />
    <meta name="theme-color" content="#f7f9fc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const saved = localStorage.getItem('coinscope-theme');
        const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <title>CoinScope — A clearer view of crypto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
